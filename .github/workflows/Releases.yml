name: Build and Publish Docker Image (Docker Hub)

on:
  push:
    branches: [ latest-dev ]
  workflow_dispatch:
    inputs:
      version:
        description: '自定义版本号 (例如: v1.0.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Dev (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          target: with-frontend
          tags: docker.io/${{ secrets.DOCKER_USERNAME }}/pt-accelerator:latest-dev

